name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Build shared package
        run: pnpm -F @chess-app/shared build

      - name: Build API
        run: pnpm -F api build

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_test
        run: pnpm -F api db:migrate

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_test
          NODE_ENV: test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm -F web build
        env:
          VITE_API_URL: http://localhost:4000

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_test
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Comment PR with check results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- ci-check-results -->';
            const normalize = (status) =>
              ['success', 'failure', 'cancelled', 'skipped'].includes(status) ? status : 'unknown';
            const icon = (status) => status === 'success' ? '✅' : '❌';
            const lintStatus = normalize('${{ steps.lint.outcome }}');
            const typecheckStatus = normalize('${{ steps.typecheck.outcome }}');
            const testStatus = normalize('${{ steps.unit_tests.outcome }}');
            const body = [
              marker,
              '## CI Check Results',
              '',
              `- ${icon(lintStatus)} Lint: \`${lintStatus}\``,
              `- ${icon(typecheckStatus)} Typecheck: \`${typecheckStatus}\``,
              `- ${icon(testStatus)} Tests: \`${testStatus}\``
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
